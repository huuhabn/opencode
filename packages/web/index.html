<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>SaaS React Starter</title>
    <meta name="title" content="SaaS React Starter" />
    <meta
      name="description"
      content="SaaS boilerplate built with React, Vite, TanStack Router, and Shadcn UI."
    />

    <!-- Open Graph / Facebook -->
    <!-- TODO: Update og:url and og:image when production domain is set -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:title" content="SaaS React Starter" />
    <meta
      property="og:description"
      content="SaaS boilerplate built with React, Vite, TanStack Router, and Shadcn UI."
    />
    <meta property="og:image" content="" />

    <!-- Twitter -->
    <!-- TODO: Update twitter:url and twitter:image when production domain is set -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="" />
    <meta property="twitter:title" content="SaaS React Starter" />
    <meta
      property="twitter:description"
      content="SaaS boilerplate built with React, Vite, TanStack Router, and Shadcn UI."
    />
    <meta property="twitter:image" content="" />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Fira+Code:wght@400..700&family=Geist+Mono:wght@400..700&family=Geist:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400..700&family=Manrope:wght@200..800&family=Merriweather:wght@300;400;700&family=Outfit:wght@400..700&family=Playfair+Display:wght@400..700&family=Source+Code+Pro:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#fff" />
    <script>
      ;(function () {
        var root = document.documentElement
        var modeMatch = document.cookie.match(/(?:^|; )vite-ui-theme=([^;]*)/)
        var mode = modeMatch ? modeMatch[1] : 'system'
        var dark =
          mode === 'dark' ||
          (mode !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        root.classList.add(dark ? 'dark' : 'light')
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#09090b' : '#ffffff')

        var themes = [
          'default',
          'claude',
          'discord',
          'supabase',
          'vercel',
          'mono',
          'notebook',
          'light-green',
          'zen',
          'astro-vista',
          'whatsapp',
        ]
        var themeMatch = document.cookie.match(/(?:^|; )active_theme=([^;]*)/)
        var theme = themeMatch ? themeMatch[1] : 'default'
        if (themes.indexOf(theme) === -1) theme = 'default'
        root.setAttribute('data-theme', theme)
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
